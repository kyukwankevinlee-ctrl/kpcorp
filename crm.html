<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KP Holdings CRM</title>

<link rel="stylesheet" href="style.css">

<style>
.crm-wrap{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.stat{
    background:#fff;
    border-radius:18px;
    padding:24px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.stat h2{
    color:#2563EB;
    margin:0;
}

.section-title{
    margin:40px 0 20px;
    color:#071A39;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:16px;
    overflow:hidden;
}

th{
    background:#071A39;
    color:white;
    padding:14px;
}

td{
    padding:12px;
    border-bottom:1px solid #eee;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:15px;
}

.btn{
    background:#2563EB;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.delete{
    background:#EF4444;
    padding:8px 12px;
    border-radius:8px;
    color:white;
    border:none;
    cursor:pointer;
}

@media(max-width:768px){
.grid{grid-template-columns:1fr;}
}
</style>

</head>
<body>

<header>
  <div class="logo-wrap">
    <img src="images/logo.png" class="logo-image">
  </div>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="crm.html">CRM</a>
  </nav>
</header>

<div class="crm-wrap">

<h1>Buyer CRM Dashboard</h1>

<div class="stats">
<div class="stat">
<h2 id="buyerCount">0</h2>
<p>Buyers</p>
</div>

<div class="stat">
<h2 id="hotCount">0</h2>
<p>Hot Leads</p>
</div>

<div class="stat">
<h2>48h</h2>
<p>RFQ Target</p>
</div>
</div>

<h2 class="section-title">Add Buyer</h2>

<div class="grid">
<input id="company" placeholder="Company">

<select id="country">
<option>UAE</option>
<option>Saudi Arabia</option>
<option>Israel</option>
<option>Oman</option>
<option>Qatar</option>
<option>Egypt</option>
</select>

<input id="email" placeholder="Email">

<select id="status">
<option>Prospect</option>
<option>Warm</option>
<option>Hot</option>
<option>Existing</option>
</select>
</div>

<button class="btn" onclick="addBuyer()">Add Buyer</button>

<h2 class="section-title">Buyer Database</h2>

<table>
<thead>
<tr>
<th>Company</th>
<th>Country</th>
<th>Status</th>
<th>Email</th>
<th></th>
</tr>
</thead>

<tbody id="buyerTable"></tbody>

</table>

</div>

<script>

let buyers = JSON.parse(localStorage.getItem("buyers")) || [

{company:"Casponet",country:"Israel",status:"Existing",email:""},

{company:"Abana",country:"Saudi Arabia",status:"Existing",email:""},

{company:"Petrotec",country:"Oman",status:"Prospect",email:""}

];

function save(){
localStorage.setItem("buyers",JSON.stringify(buyers));
render();
}

function render(){

const body=document.getElementById("buyerTable");
body.innerHTML="";

buyers.forEach((b,i)=>{

body.innerHTML += `
<tr>
<td>${b.company}</td>
<td>${b.country}</td>
<td>${b.status}</td>
<td>${b.email}</td>
<td><button class="delete" onclick="removeBuyer(${i})">Delete</button></td>
</tr>`;

});

document.getElementById("buyerCount").innerText=buyers.length;

document.getElementById("hotCount").innerText=
buyers.filter(x=>x.status=="Hot").length;

}

function addBuyer(){

buyers.push({

company:company.value,
country:country.value,
status:status.value,
email:email.value

});

company.value="";
email.value="";
save();

}

function removeBuyer(i){

buyers.splice(i,1);
save();

}

render();

</script>

</body>
</html>
